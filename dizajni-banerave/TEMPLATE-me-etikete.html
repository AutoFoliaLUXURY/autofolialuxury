<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<title>Банер – чорапи за снег</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  :root{
    --ink:#0D1724; --ink-2:#14243A; --gold:#D2AE62; --gold-2:#E9CB86; --gold-deep:#A9853C;
    --red:#D7262E; --ice:#EAF3FB; --ice-2:#D6E6F5;
    --display:'Fira Sans Extra Condensed','Arial Narrow',sans-serif;
    --sans:'Manrope',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--ink);}
  .banner{position:relative;overflow:hidden;font-family:var(--sans);color:#fff;
    background:
      radial-gradient(60% 90% at 10% 100%, rgba(66,120,190,.28), transparent 70%),
      radial-gradient(40% 60% at 35% 0%, rgba(210,174,98,.10), transparent 70%),
      linear-gradient(115deg, #0B1420 0%, #13233A 55%, #0E1A2B 100%);}
  /* snijegu i lehtë mbi pjesën e errët */
  .snow{position:absolute;inset:0;pointer-events:none;opacity:.55;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 90px 120px, #fff 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 160px 60px, rgba(255,255,255,.8) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 230px 170px, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 60px 200px, #fff 50%, transparent 51%);
    background-size:260px 230px;}
  /* paneli i akullt ku rri produkti (fotoja ka sfond të bardhë → multiply e shkrin) */
  .ice{position:absolute;background:
      radial-gradient(55% 55% at 55% 55%, #FFFFFF 0%, #F3F8FD 45%, var(--ice) 70%, var(--ice-2) 100%);}
  .ice::after{content:"";position:absolute;inset:0;opacity:.6;
    background-image:
      radial-gradient(3px 3px at 40px 40px, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 140px 110px, #fff 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 210px 30px, #fff 50%, transparent 51%);
    background-size:240px 160px;}
  .seam{position:absolute;background:linear-gradient(180deg,var(--gold-2),var(--gold) 50%,var(--gold-deep));}
  .product{position:absolute;mix-blend-mode:multiply;object-fit:contain;filter:saturate(1.08) contrast(1.03);}
  .shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side, rgba(13,23,36,.28), transparent);}

  .kicker{display:inline-flex;align-items:center;gap:12px;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--ink);
    font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:8px;
    box-shadow:0 10px 24px -10px rgba(210,174,98,.7);}
  .kicker svg{flex:0 0 auto;}
  .title{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;line-height:.9;letter-spacing:.005em;
    text-shadow:0 6px 30px rgba(0,0,0,.35);}
  .title .red{display:inline-block;background:var(--red);color:#fff;padding:.02em .16em .04em .12em;transform:skewX(-8deg);
    box-shadow:0 18px 40px -16px rgba(215,38,46,.8);}
  .title .red span{display:inline-block;transform:skewX(8deg);}
  .title .sub{display:block;color:#fff;font-weight:800;}
  .lead{color:#C9D5E4;font-weight:600;line-height:1.45;border-left:4px solid var(--red);}
  .lead b{color:#fff;font-weight:800;}

  .feats{display:grid;grid-template-columns:repeat(4,1fr);}
  .feat{display:flex;flex-direction:column;align-items:center;text-align:center;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.14);border-radius:16px;color:#E8EEF6;font-weight:700;line-height:1.15;}
  .feat svg{stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  .buy{display:flex;align-items:center;}
  .price{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);}
  .price .lbl{background:var(--red);font-family:var(--display);font-style:italic;font-weight:800;display:flex;align-items:center;letter-spacing:.04em;}
  .price .val{background:#fff;color:var(--ink);font-family:var(--display);font-style:italic;font-weight:900;display:flex;align-items:baseline;gap:.18em;}
  .price .val small{font-size:.5em;font-weight:800;}
  .cta{display:inline-flex;align-items:center;background:linear-gradient(180deg,var(--gold-2),var(--gold) 60%,#C79F4F);color:var(--ink);
    font-family:var(--display);font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;
    box-shadow:0 18px 40px -14px rgba(210,174,98,.75), inset 0 1px 0 rgba(255,255,255,.6);}
  .cta svg{stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .sizes{font-family:var(--display);font-weight:700;letter-spacing:.06em;color:var(--ink);}
  .sizes b{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:8px;}
  .banner .sizes.badge b{width:auto;height:auto;gap:10px;padding:10px 18px;white-space:nowrap;font-size:20px;border-radius:999px;border-color:var(--gold-deep);
    background:rgba(255,255,255,.7);box-shadow:0 10px 24px -14px rgba(13,23,36,.5);letter-spacing:.04em;text-transform:uppercase;}
  .banner.d .sizes.badge{right:auto;left:1200px;top:56px;}
  .banner.m .sizes.badge{top:250px;}
  .banner.m .product{left:500px;top:-30px;width:430px;height:430px;}
  .banner.m .shadow{left:520px;top:330px;width:460px;}
  .brand{position:absolute;font-family:var(--display);font-style:italic;font-weight:800;letter-spacing:.02em;}
  .brand .a{color:#fff;} .brand .l{color:var(--gold);}

  /* ================= KOMPJUTER 1920 × 720 ================= */
  .d{width:1920px;height:720px;}
  .d .ice{left:1010px;top:0;right:0;bottom:0;clip-path:polygon(140px 0,100% 0,100% 100%,0 100%);}
  .d .seam{left:1010px;top:0;width:150px;height:720px;clip-path:polygon(140px 0,150px 0,10px 100%,0 100%);}
  .d .shadow{left:1200px;top:600px;width:660px;height:90px;}
  .d .product{left:1150px;top:10px;width:720px;height:720px;}
  .d .content{position:absolute;left:110px;top:56px;width:900px;}
  .d .kicker{font-size:24px;padding:9px 18px;}
  .d .title{margin-top:22px;font-size:112px;}
  .d .title .sub{font-size:66px;margin-top:12px;}
  .d .lead{margin-top:22px;font-size:23px;padding-left:20px;max-width:760px;}
  .d .feats{margin-top:24px;gap:12px;width:860px;}
  .d .feat{flex-direction:row;text-align:left;padding:12px 14px;font-size:16px;gap:10px;}
  .d .feat svg{width:34px;height:34px;flex:0 0 auto;}
  .d .buy{position:absolute;left:110px;bottom:48px;gap:26px;}
  .d .price .lbl{font-size:30px;padding:0 20px;}
  .d .price .val{font-size:62px;padding:4px 22px 6px;}
  .d .cta{font-size:32px;gap:14px;padding:18px 34px;}
  .d .cta svg{width:32px;height:32px;}
  .d .sizes{position:absolute;right:56px;top:40px;font-size:20px;display:flex;gap:8px;align-items:center;}
  .d .sizes b{width:44px;height:36px;font-size:17px;}
  .d .brand{left:1240px;bottom:28px;font-size:0;}

  /* ================= CELULAR 1080 × 1000 ================= */
  .m{width:1080px;height:1000px;}
  .m .ice{left:0;top:0;right:0;height:470px;clip-path:polygon(0 0,100% 0,100% 82%,0 100%);}
  .m .seam{left:0;top:0;width:1080px;height:480px;clip-path:polygon(0 470px,100% 385px,100% 395px,0 480px);}
  .m .shadow{left:470px;top:360px;width:560px;height:70px;}
  .m .product{left:430px;top:-20px;width:470px;height:470px;}
  .m .content{position:absolute;left:56px;top:40px;right:56px;}
  .m .kicker{font-size:28px;padding:10px 18px;}
  .m .title{position:absolute;left:56px;top:462px;font-size:116px;}
  .m .title .sub{font-size:64px;margin-top:8px;}
  .m .lead{position:absolute;left:56px;top:136px;width:400px;font-size:26px;padding-left:18px;color:#2B3B52;}
  .m .lead b{color:var(--ink);}
  .m .feats{position:absolute;left:56px;right:56px;top:664px;gap:12px;}
  .m .feat{padding:12px 6px 10px;font-size:18px;gap:6px;}
  .m .feat svg{width:36px;height:36px;}
  .m .buy{position:absolute;left:56px;right:56px;top:806px;justify-content:space-between;}
  .m .price .lbl{font-size:30px;padding:0 16px;}
  .m .price .val{font-size:58px;padding:2px 18px 4px;}
  .m .cta{font-size:32px;gap:12px;padding:18px 30px;}
  .m .cta svg{width:30px;height:30px;}
  .m .sizes{position:absolute;left:56px;top:330px;font-size:22px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;width:380px;}
  .m .sizes b{width:46px;height:38px;font-size:18px;}
  .m .sizes em{font-style:normal;width:100%;margin-bottom:4px;}
</style>
</head>
<body>
<script>
  // ?v=m → celular, përndryshe kompjuter
  const V = new URLSearchParams(location.search).get('v') === 'm' ? 'm' : 'd';
</script>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-flake" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10"/><path d="M9.5 3.5 12 6l2.5-2.5M9.5 20.5 12 18l2.5 2.5M3.6 10.4 7 9.2 6 5.8M20.4 13.6 17 14.8l1 3.4M3.6 13.6 7 14.8l-1 3.4M20.4 10.4 17 9.2l1-3.4"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.4 7.5 10 4.3-1.6 7.5-5.4 7.5-10v-6z"/><path d="m8.5 12 2.4 2.4 4.6-4.8"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 1.8M9.5 2.5h5M12 2.5V6M18.5 6.5l1.5-1.5"/></symbol>
    <symbol id="i-feather" viewBox="0 0 24 24"><path d="M20.2 3.8c-5.6-.6-11.4 2.6-13.3 8.6L5.5 18.5"/><path d="M6.9 12.4c3.6.4 7.4-.9 9.8-3.9M6.2 15.6c3.6.6 7.1-.4 9.6-3.1"/><path d="M20.2 3.8c.4 6.6-3.5 12.2-10 13.4"/></symbol>
    <symbol id="i-rim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.6"/><path d="M12 6.5v3.9M17.2 10.3l-3.7 1.2M15.2 16.5l-2.3-3.2M8.8 16.5l2.3-3.2M6.8 10.3l3.7 1.2"/></symbol>
    <symbol id="i-glove" viewBox="0 0 24 24"><path d="M7 21.5h9.5v-3.5H7z"/><path d="M7 18V9.5a2 2 0 0 1 4 0V5.5a2 2 0 0 1 4 0V18"/><path d="M15 11.5l1.4-2.2a1.9 1.9 0 0 1 3.2 2.1L16.5 16"/><path d="M7.5 20h8.5"/></symbol>
    <symbol id="i-blade" viewBox="0 0 24 24"><path d="M9 3h6v6l4 9H5l4-9z"/><path d="M5 18l1.2 2.5h11.6L19 18"/><path d="M10.5 6h3"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.8s6.5 7.2 6.5 11.7a6.5 6.5 0 0 1-13 0C5.5 10 12 2.8 12 2.8z"/><path d="M9 15a3 3 0 0 0 3 3"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M3.5 16.5v-3.8l2-5.2a2 2 0 0 1 1.9-1.3h9.2a2 2 0 0 1 1.9 1.3l2 5.2v3.8z"/><path d="M3.5 12.5h17"/><circle cx="7.5" cy="16.8" r="1.8"/><circle cx="16.5" cy="16.8" r="1.8"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2.5 3.5h2.7l2.4 11.2h10.8l2.1-7.9H6.3"/><circle cx="9.3" cy="19.3" r="1.5"/><circle cx="17" cy="19.3" r="1.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </defs>
</svg>

<div class="banner" id="b">
  <div class="snow"></div>
  <div class="ice"></div>
  <div class="seam"></div>
  <div class="shadow"></div>
  <img class="product" src="scraper.webp" alt="">

  <div class="content">
    <div class="kicker"><svg width="1.1em" height="1.1em" style="color:var(--ink)"><use href="#i-flake"/></svg>Зимска опрема</div>
    <h1 class="title" data-slot="title"><span class="red"><span>Гребалка за снег</span></span><span class="sub">со топла ракавица</span></h1>
    <p class="lead" data-slot="lead">Исчистете снег и мраз од стаклото за секунди –<br><b>а рацете остануваат топли и суви.</b></p>
    <div class="feats" data-slot="feats">
      <div class="feat"><svg><use href="#i-glove"/></svg>Мека ракавица со крзно</div>
      <div class="feat"><svg><use href="#i-blade"/></svg>Цврст нож за мраз</div>
      <div class="feat"><svg><use href="#i-drop"/></svg>Водоотпорен материјал</div>
      <div class="feat"><svg><use href="#i-car"/></svg>За секое возило</div>
    </div>
  </div>

  <div class="sizes badge" data-slot="sizes"><b><svg width="1.1em" height="1.1em" style="color:var(--ink)"><use href="#i-flake"/></svg>Топли раце на минус</b></div>

  <div class="buy">
    <div class="price"><span class="lbl">ЦЕНА</span><span class="val">110 <small>MKD</small></span></div>
    <div class="cta"><svg><use href="#i-cart"/></svg>Нарачај сега<svg><use href="#i-arrow"/></svg></div>
  </div>
</div>

<script>
  const b = document.getElementById('b');
  b.classList.add(V);
  if(V === 'd'){
  } else {
    // në celular titulli dhe veçoritë dalin poshtë, në pjesën e errët; teksti i shkurtër te paneli i akullt
    const c = document.querySelector('.content');
    b.appendChild(document.querySelector('[data-slot=title]'));
    b.appendChild(document.querySelector('[data-slot=lead]'));
    b.appendChild(document.querySelector('[data-slot=feats]'));
    document.querySelector('[data-slot=lead]').innerHTML = 'Чисто стакло за секунди, <b>топли и суви раце.</b>';
  }
</script>
</body>
</html>
