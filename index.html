<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Folia LUXURY</title>
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#111827; --muted:#6b7280;
  --line:#e5e7eb; --dark:#111827; --green:#065f46; --greenbg:#ecfdf5;
  --greenline:#a7f3d0; --red:#dc2626; --accent:#111827; --yellow:#fefce8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:15px}

/* top bar */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hwrap{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted)}
.brand b{display:block;font-size:17px;letter-spacing:.3px}
.brand span{display:block;font-size:10px;color:var(--muted);letter-spacing:1.5px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{border:none;background:none;padding:9px 14px;border-radius:999px;font-size:14px;color:var(--muted);font-weight:600}
nav button.active{background:var(--dark);color:#fff}
.newjob{border:1px solid var(--dark);background:#fff;color:var(--dark);padding:9px 18px;border-radius:999px;font-weight:700}
.newjob:hover{background:var(--dark);color:#fff}

main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:6px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
label.fld{display:block;margin-bottom:12px}
label.fld small{display:block;color:var(--muted);margin-bottom:5px;font-size:13px}
input[type=text],input[type=tel],input[type=number],input[type=datetime-local],input[type=date],select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--dark)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.row2,.row3{grid-template-columns:1fr}nav{width:100%;margin-left:0}
  .modal{margin-top:10px;padding:18px}
  .actions{position:sticky;bottom:0;background:#fff;padding-top:12px;margin:20px -18px -18px;padding:14px 18px;border-top:1px solid var(--line)}
  .actions .btn{flex:1;min-width:auto}
  .svc{padding:15px 14px}.svc input{width:22px;height:22px}
  input[type=text],input[type=tel],input[type=number],input[type=datetime-local],input[type=date],select{padding:13px 12px;font-size:16px}
  .cell{height:64px}
  .newjob{padding:11px 18px}
}

/* services checklist */
.svc{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.svc:hover{border-color:var(--dark)}
.svc input{width:18px;height:18px}
.svc .nm{flex:1;font-weight:600}
.svc .pr{color:var(--muted);font-weight:700;white-space:nowrap}
.svc.on{border-color:var(--green);background:var(--greenbg)}

.btn{background:var(--dark);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-weight:700;font-size:15px}
.btn:hover{opacity:.9}
.btn.ghost{background:#fff;color:var(--dark);border:1px solid var(--line)}
.btn.red{background:#fff;color:var(--red);border:1px solid #fca5a5}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:8px}
.totbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}
.totbar .t{font-size:22px;font-weight:800}

/* calendar */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.calhead .nav{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:999px;font-size:16px}
.calhead .today{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:999px;font-weight:600}
.calhead .range{font-weight:700;font-size:16px}
.caltable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.caltable th,.caltable td{border:1px solid var(--line);padding:0;vertical-align:top}
.caltable th{background:#fff;padding:10px;text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase}
.caltable th b{display:block;color:var(--ink);font-size:16px;margin-top:2px}
.caltable th.todaycol{background:var(--yellow)}
.timecol{width:56px;background:#fff;color:var(--muted);font-size:13px;text-align:center;padding:14px 4px!important;font-weight:600}
.cell{height:74px;padding:6px!important;position:relative}
.cell.todaycol{background:var(--yellow)}
.appt{background:var(--greenbg);border:1px solid var(--greenline);border-radius:10px;padding:7px 9px;height:100%;cursor:pointer;overflow:hidden}
.appt:hover{border-color:var(--green)}
.appt b{display:block;font-size:14px;line-height:1.2}
.appt span{font-size:12px;color:var(--muted)}
.appt.paid{background:#eff6ff;border-color:#bfdbfe}
.emptyslot{color:#cbd5e1;font-size:13px;display:flex;align-items:center;justify-content:center;height:100%;cursor:pointer}
.emptyslot:hover{color:var(--dark);background:#fafafa}
.calscroll{overflow-x:auto}

/* reports */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat .big{font-size:26px;font-weight:800}
.stat .sub{color:var(--muted);font-size:12px;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.chips button.active{background:var(--dark);color:#fff;border-color:var(--dark)}

/* service catalog rows */
.catrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.catrow .info{flex:1}
.catrow .info b{font-size:16px}
.catrow .info small{display:block;color:var(--muted);margin-top:3px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:20px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:24px;max-width:560px;width:100%;margin-top:40px}
.modal h3{margin:0 0 16px;font-size:20px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.green{background:var(--greenbg);color:var(--green)}
.pill.gray{background:#f3f4f6;color:var(--muted)}
.pill.blue{background:#eff6ff;color:#1d4ed8}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;opacity:0;transition:.3s;z-index:200;pointer-events:none}
.toast.show{opacity:1}
.muted{color:var(--muted)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:8px}
.tools button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:5px}
.empty{text-align:center;color:var(--muted);padding:40px}
.checkline{display:flex;align-items:center;gap:8px;margin-bottom:8px}
</style>
</head>

<!-- APP SHELL -->
<div id="appShell" style="display:none">

<header>
  <div class="hwrap">
    <div class="logo">AF</div>
    <div class="brand"><b>Auto Folia LUXURY</b><span>ФОЛИИ НА СТАКЛА</span></div>
    <nav>
      <button data-view="calendar" class="active">Календар</button>
      <button data-view="reports">Извештаи</button>
      <button data-view="services">Услуги</button>
      <button data-view="settings">Поставки</button>
    </nav>
    <button class="newjob" onclick="openJob()">+ Нова работа</button>
    <div class="tools">
      <button onclick="refreshAll()">↻ Освежи</button>
      <button onclick="exportBackup()">⬇ Бекап</button>
      <button onclick="doLogout()">Одјава</button>
    </div>
  </div>
</header>

<main id="app"></main>

<!-- Job modal -->
<div class="overlay" id="jobOverlay">
  <div class="modal" style="max-width:760px">
    <h3 id="jobTitle">Нова работа</h3>
    <div class="grid2">
      <div>
        <label class="fld"><small>Термин (датум и час)</small>
          <input type="datetime-local" id="j_when"></label>
        <div class="card" style="margin:0 0 0 0;padding:16px">
          <h2 style="font-size:15px;margin-bottom:12px">Клиент</h2>
          <div class="row2">
            <label class="fld"><small>Име</small><input type="text" id="j_first"></label>
            <label class="fld"><small>Презиме</small><input type="text" id="j_last"></label>
          </div>
          <label class="fld"><small>Телефон</small><input type="tel" id="j_phone"></label>
          <label class="checkline"><input type="checkbox" id="j_firma"> Фирма</label>
        </div>
        <div class="card" style="margin:14px 0 0 0;padding:16px">
          <h2 style="font-size:15px;margin-bottom:12px">Возило</h2>
          <div class="row2">
            <label class="fld"><small>Модел</small><input type="text" id="j_model" placeholder="пр. Golf 7"></label>
            <label class="fld"><small>Година</small><input type="text" id="j_year" placeholder="2026"></label>
          </div>
          <div class="row2">
            <label class="fld"><small>Регистарска (опц.)</small><input type="text" id="j_plate"></label>
            <label class="fld"><small>Тип фолија (опц.)</small><input type="text" id="j_film" placeholder="пр. 20% керамика"></label>
          </div>
        </div>
      </div>
      <div>
        <div class="card" style="margin:0;padding:16px">
          <h2 style="font-size:15px;margin-bottom:12px">Услуги</h2>
          <div id="j_services"></div>
          <div class="totbar"><span class="muted">Вкупно</span><span class="t" id="j_total">0 MKD</span></div>
        </div>
        <div class="card" id="j_paybox" style="margin:14px 0 0 0;padding:16px">
          <h2 style="font-size:15px;margin-bottom:12px">Наплата</h2>
          <div id="j_paystatus"></div>
          <input type="checkbox" id="j_paid" style="display:none">
          <label class="fld"><small>Забелешка (опц.)</small><input type="text" id="j_note"></label>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn red" id="j_delete" style="margin-right:auto;display:none" onclick="deleteJob()">Избриши</button>
      <button class="btn ghost" onclick="closeJob()">Откажи</button>

<script>
/* ============================================================

const SB_URL = 'https://fzgnhfbsibskkuiwcrls.supabase.co';
const SB_KEY = 'sb_publishable_ly41HIzLLqF1ZD1XJUB6AQ__8xd138k';
let SESSION = null;               // holds the logged-in session
const sbHeaders = (extra={}) => Object.assign({
  'apikey': SB_KEY,
  'Content-Type': 'application/json',
  'Authorization': 'Bearer ' + (SESSION ? SESSION.access_token : SB_KEY)
}, extra);

/* thin REST helper against Supabase */
async function sbRest(path, opts={}){
  const res = await fetch(SB_URL + '/rest/v1/' + path, {
    ...opts,
    headers: sbHeaders(opts.headers||{})
  });
  if(!res.ok){ const t=await res.text(); throw new Error(res.status+' '+t); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

/* ============================================================
   DATA LAYER  — DB.data is the in-memory cache used by all the
   render code. loadAll() pulls from Supabase; the save* helpers
   push single rows back. Column names map: when->when_at,
   first->first_name, last->last_name.
   ============================================================ */
const DEFAULT_SERVICES=[
  ['Предни стакла',1000],['Задни Стакла',2000],
  ['Задни Стакла со Атест седан',4000],['Сите стакла Седан со Атест',5000],
  ['Задни Стакла Suv',3000],['Сите стакла SUV',4000],

  ['Chameleon',3000],['Led Lights',1500],['Fatjon',2220],['Usluga',500]
];
const DEFAULT_SETTINGS={ name:'Auto Folia LUXURY',address:'Saraj/Skopje',

  startHour:10,endHour:20,slotMin:120,days:[1,2,3,4,5] };

const DB = {
  data:{ services:[], jobs:[], settings:{} },

  // map a DB row -> app job shape used by the UI
  jobFromRow(r){ return { id:r.id, when:r.when_at, first:r.first_name, last:r.last_name,
    phone:r.phone, firma:r.firma, model:r.model, year:r.year, plate:r.plate, film:r.film,
    services:r.services||[], paid:r.paid, note:r.note, total:Number(r.total)||0 }; },
  jobToRow(j){ return { when_at:j.when, first_name:j.first, last_name:j.last, phone:j.phone,

  async loadAll(){
    // services
    const svc = await sbRest('services?select=*&order=created_at.asc');

  async seedServices(){

    const nj=this.jobFromRow(r); this.data.jobs.push(nj); return nj.id;
  },
  async updateJob(id,j){
    await sbRest('jobs?id=eq.'+id, { method:'PATCH', body:JSON.stringify(this.jobToRow(j)) });
    const i=this.data.jobs.findIndex(x=>x.id===id); if(i>=0) this.data.jobs[i]={...j,id};

};

const $=s=>document.querySelector(s);

/* ============ VIEW ROUTER ============ */
let view='calendar';

function render(){

/* ============ CALENDAR ============ */
let weekStart=startOfWeek(new Date());
function startOfWeek(d){ d=new Date(d); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d; }
function fmtDate(d){ return d.toLocaleDateString('mk-MK',{day:'2-digit',month:'short'}); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function renderCalendar(){
  const s=DB.data.settings;
  const days=s.days.slice().sort();
  const dayCount=Math.max(...days)-Math.min(...days)+1;
  const firstOffset=Math.min(...days)-1;
  const cols=[];
  for(let i=0;i<7;i++){ if(days.includes(i+1)){ const d=new Date(weekStart); d.setDate(d.getDate()+i); cols.push(d);} }
  const slots=[];
  for(let h=s.startHour; h<s.endHour; h+= (s.slotMin/60)){ slots.push(h); }
  const today=ymd(new Date());
  const dow=['ПОН','ВТО','СРЕ','ЧЕТ','ПЕТ','САБ','НЕД'];

  const wkEnd=new Date(cols[cols.length-1]);
  let html=`<h1>Календар</h1>
  <div class="calhead">
    <button class="nav" onclick="shiftWeek(-1)">←</button>
    <button class="nav" onclick="shiftWeek(1)">→</button>
    <button class="today" onclick="goToday()">Денес</button>
    <span class="range">${fmtDate(cols[0])} – ${fmtDate(wkEnd)} ${cols[0].getFullYear()}</span>
  </div>
  <div class="calscroll"><table class="caltable"><thead><tr><th class="timecol"></th>`;
  cols.forEach(d=>{ const t=ymd(d)===today?'todaycol':''; const idx=(d.getDay()+6)%7;
    html+=`<th class="${t}">${dow[idx]}<b>${d.getDate()} ${d.toLocaleDateString('mk-MK',{month:'short'})}</b></th>`; });
  html+=`</tr></thead><tbody>`;
  slots.forEach(h=>{
    const hh=Math.floor(h), mm=Math.round((h-hh)*60);
    const label=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
    html+=`<tr><td class="timecol">${label}</td>`;
    cols.forEach(d=>{
      const t=ymd(d)===today?'todaycol':'';
      const slotStart=new Date(d); slotStart.setHours(hh,mm,0,0);
      const job=DB.data.jobs.find(j=>{ const jd=new Date(j.when); return jd.getFullYear()===d.getFullYear()&&jd.getMonth()===d.getMonth()&&jd.getDate()===d.getDate()&&jd.getHours()===hh&&Math.abs(jd.getMinutes()-mm)<1; });
      if(job){
        const car=(job.model||'')+(job.year?' '+job.year:'');
        const who=[job.first,job.last].filter(Boolean).join(' ');
        html+=`<td class="cell ${t}"><div class="appt ${job.paid?'paid':''}" onclick="openJob('${job.id}')"><b>${car||'—'}</b><span>${who||'Клиент'}</span></div></td>`;
      }else{
        const iso=ymd(d)+'T'+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
        html+=`<td class="cell ${t}"><div class="emptyslot" onclick="openJob(null,'${iso}')">+ Резервирај</div></td>`;
      }
    });
    html+=`</tr>`;
  });
  html+=`</tbody></table></div>`;
  $('#app').innerHTML=html;
}
function shiftWeek(n){ weekStart.setDate(weekStart.getDate()+n*7); weekStart=new Date(weekStart); renderCalendar(); }
function goToday(){ weekStart=startOfWeek(new Date()); renderCalendar(); }

/* ============ JOB MODAL ============ */
let editingJobId=null;
function openJob(id=null, presetWhen=null){
  editingJobId=id;
  const job=id?DB.data.jobs.find(j=>j.id===id):null;
  $('#jobTitle').textContent=job?'Измени работа':'Нова работа';
  $('#j_delete').style.display=job?'inline-block':'none';
  const now=new Date(); now.setMinutes(0,0,0);
  const def=presetWhen||(job?job.when:localISO(now));
  $('#j_when').value=def;
  $('#j_first').value=job?.first||'';
  $('#j_last').value=job?.last||'';
  $('#j_phone').value=job?.phone||'';
  $('#j_firma').checked=job?.firma||false;
  $('#j_model').value=job?.model||'';
  $('#j_year').value=job?.year||'';
  $('#j_plate').value=job?.plate||'';
  $('#j_film').value=job?.film||'';
  $('#j_paid').checked=job?.paid||false;
  $('#j_note').value=job?.note||'';
  // ---- payment status box (step 2) ----
  const payStatus=$('#j_paystatus'), confirmBtn=$('#j_confirmpay'), payBox=$('#j_paybox');
  if(!job){
    // NEW booking: payment hidden entirely — step 1 is just "remember the appointment"
    payBox.style.display='none';
    confirmBtn.style.display='none';
  }else{
    payBox.style.display='block';
    if(job.paid){
      payStatus.innerHTML=`<div class="pill green" style="font-size:14px;padding:8px 14px">✓ Платено (Cash) · ${money(job.total)}</div>
        <div style="margin-top:10px"><button class="btn ghost sm" onclick="unpay()">Врати во неплатено</button></div>`;
      confirmBtn.style.display='none';
    }else{
      payStatus.innerHTML=`<div class="pill gray" style="font-size:14px;padding:8px 14px">Сè уште неплатено</div>`;
      confirmBtn.style.display='inline-block';
    }
  }
  // services checklist
  const sel=new Set(job?.services||[]);
  let sh='';
  DB.data.services.filter(s=>s.active).forEach(s=>{
    const on=sel.has(s.id);
    sh+=`<label class="svc ${on?'on':''}" data-id="${s.id}" data-price="${s.price}">
      <input type="checkbox" ${on?'checked':''} onchange="toggleSvc(this)">
      <span class="nm">${s.name}</span><span class="pr">${money(s.price)}</span></label>`;
  });
  $('#j_services').innerHTML=sh;
  recalcJob();
  $('#jobOverlay').classList.add('show');
}
function localISO(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function toggleSvc(cb){ const l=cb.closest('.svc'); l.classList.toggle('on',cb.checked); recalcJob(); }
function recalcJob(){
  let t=0;
  document.querySelectorAll('#j_services .svc').forEach(l=>{
    if(l.querySelector('input').checked) t+=Number(l.dataset.price);
  });
  $('#j_total').textContent=money(t);
}
function closeJob(){ $('#jobOverlay').classList.remove('show'); }
async function saveJob(){
  const when=$('#j_when').value;
  if(!when){ toast('Внеси термин'); return; }
  const services=[];
  document.querySelectorAll('#j_services .svc').forEach(l=>{ if(l.querySelector('input').checked) services.push(l.dataset.id); });
  const rec={
    id:editingJobId||uid(),
    when, first:$('#j_first').value.trim(), last:$('#j_last').value.trim(),
    phone:$('#j_phone').value.trim(), firma:$('#j_firma').checked,
    model:$('#j_model').value.trim(), year:$('#j_year').value.trim(),
    plate:$('#j_plate').value.trim(), film:$('#j_film').value.trim(),
    services, paid:$('#j_paid').checked, note:$('#j_note').value.trim(),
    total: services.reduce((a,id)=>{const s=DB.data.services.find(x=>x.id===id);return a+(s?s.price:0);},0)
  };
  busy(true);
  try{
    if(editingJobId){ await DB.updateJob(editingJobId, rec); }
    else { await DB.addJob(rec); }
    closeJob(); render(); toast('Зачувано');
  }catch(e){ alert('Грешка при зачувување:\n\n'+(e.message||e)); console.error(e); }
  busy(false);
}
async function confirmPay(){
  // step 2: mark this booking as paid — lightweight patch, no full re-save
  if(!editingJobId){ $('#j_paid').checked=true; await saveJob(); return; }
  busy(true);
  try{
    await DB.patchJob(editingJobId,{paid:true});
    closeJob(); render(); toast('Плаќањето е потврдено');
  }catch(e){ alert('Грешка при потврда:\n\n'+(e.message||e)); console.error(e); }
  busy(false);
}
async function unpay(){
  busy(true);
  try{ await DB.patchJob(editingJobId,{paid:false}); openJob(editingJobId); render(); }
  catch(e){ toast('Грешка'); console.error(e); }
  busy(false);
}
async function deleteJob(){
  if(!editingJobId) return;
  if(!confirm('Да се избрише оваа работа?')) return;
  busy(true);
  try{ await DB.deleteJob(editingJobId); closeJob(); render(); toast('Избришано'); }
  catch(e){ toast('Грешка'); console.error(e); }
  busy(false);
}

/* ============ REPORTS ============ */
let repPeriod='month';
function periodRange(){
  const now=new Date(); let from,to;
  if(repPeriod==='today'){ from=new Date(now); from.setHours(0,0,0,0); to=new Date(now); to.setHours(23,59,59,999); }
  else if(repPeriod==='week'){ from=startOfWeek(now); to=new Date(from); to.setDate(to.getDate()+6); to.setHours(23,59,59,999); }
  else if(repPeriod==='month'){ from=new Date(now.getFullYear(),now.getMonth(),1); to=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59,999); }
  else { from=new Date(now.getFullYear(),0,1); to=new Date(now.getFullYear(),11,31,23,59,59,999); }
  return {from,to};
}
function renderReports(){
  const {from,to}=periodRange();
  const inRange=DB.data.jobs.filter(j=>{const d=new Date(j.when);return d>=from&&d<=to;});
  const paid=inRange.filter(j=>j.paid);
  const revenue=paid.reduce((a,j)=>a+(j.total||0),0);
  const unpaid=inRange.filter(j=>!j.paid).length;
  const avg=paid.length?Math.round(revenue/paid.length):0;
  const s=DB.data.settings;
  const vat= s.vatOn ? Math.round(revenue - revenue/(1+s.vatRate/100)) : 0;
  // sold services
  const sold={};
  paid.forEach(j=>(j.services||[]).forEach(id=>{ const sv=DB.data.services.find(x=>x.id===id); if(sv){ if(!sold[id])sold[id]={name:sv.name,count:0,sum:0}; sold[id].count++; sold[id].sum+=sv.price; }}));
  const soldArr=Object.values(sold).sort((a,b)=>b.sum-a.sum);

  let html=`<h1>Извештаи</h1>
  <div class="chips">
    <button class="${repPeriod==='today'?'active':''}" onclick="setPeriod('today')">Денес</button>
    <button class="${repPeriod==='week'?'active':''}" onclick="setPeriod('week')">Оваа недела</button>
    <button class="${repPeriod==='month'?'active':''}" onclick="setPeriod('month')">Овој месец</button>
    <button class="${repPeriod==='year'?'active':''}" onclick="setPeriod('year')">Оваа година</button>
  </div>
  <div class="stats">
    <div class="stat"><small>Наплатен приход</small><div class="big">${money(revenue)}</div><div class="sub">${paid.length} платени работи</div></div>
    <div class="stat"><small>ДДВ (${s.vatOn?s.vatRate+'%':'исклучено'})</small><div class="big">${money(vat)}</div><div class="sub">Нето ${money(revenue-vat)}</div></div>
    <div class="stat"><small>Платени работи</small><div class="big">${paid.length}</div><div class="sub">Просечен смет ${money(avg)}</div></div>
    <div class="stat"><small>Сè уште неплатени</small><div class="big">${unpaid}</div><div class="sub">Закажани во периодот</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Продадени услуги</h2>`;
  if(soldArr.length===0) html+=`<div class="empty">Нема наплатени работи во периодот.</div>`;
  soldArr.forEach(x=>{ html+=`<div class="catrow" style="margin-bottom:8px"><div class="info"><b>${x.name}</b><small>${x.count} автомобили</small></div><b>${money(x.sum)}</b></div>`; });
  html+=`</div>
    <div class="card"><h2>Плаќања</h2>
      <div class="catrow" style="margin-bottom:8px"><div class="info"><b>Cash</b><small>${paid.length} работи</small></div><b>${money(revenue)}</b></div>
      <h2 style="margin-top:20px">Работен тек</h2>
      <div class="checkline"><span class="muted" style="flex:1">Закажано</span><b>${inRange.length}</b></div>
      <div class="checkline"><span class="muted" style="flex:1">Наплатено</span><b>${paid.length}</b></div>
      <div class="checkline"><span class="muted" style="flex:1">Неплатено</span><b>${unpaid}</b></div>
    </div>
  </div>`;
  $('#app').innerHTML=html;
}
function setPeriod(p){ repPeriod=p; renderReports(); }

/* ============ SETTINGS ============ */
function renderSettings(){
  const s=DB.data.settings;
  const dayNames=['Пон','Вто','Сре','Чет','Пет','Саб','Нед'];
  let dayBtns='';
  for(let i=1;i<=7;i++){ const on=s.days.includes(i);
    dayBtns+=`<button class="chip-day ${on?'active':''}" onclick="toggleDay(${i})" style="border:1px solid ${on?'#111827':'#e5e7eb'};background:${on?'#111827':'#fff'};color:${on?'#fff':'#6b7280'};padding:8px 14px;border-radius:999px;font-weight:600;margin-right:6px;margin-bottom:6px">${dayNames[i-1]}</button>`; }
  $('#app').innerHTML=`<h1>Поставки</h1>
  <div class="grid2">
    <div class="card"><h2>Работилница</h2>
      <label class="fld"><small>Име</small><input type="text" id="set_name" value="${s.name}"></label>
      <label class="fld"><small>Адреса</small><input type="text" id="set_addr" value="${s.address}"></label>
      <label class="fld"><small>Телефон</small><input type="text" id="set_phone" value="${s.phone}"></label>
      <label class="fld"><small>Даночен број</small><input type="text" id="set_tax" value="${s.tax}"></label>
      <label class="fld"><small>Валута</small><input type="text" id="set_cur" value="${s.currency}"></label>
    </div>
    <div class="card"><h2>ДДВ</h2>
      <label class="checkline"><input type="checkbox" id="set_vaton" ${s.vatOn?'checked':''}> Пресметај ДДВ на извештаи</label>
      <label class="fld"><small>Стапка на ДДВ %</small><input type="number" id="set_vat" value="${s.vatRate}"></label>
      <p class="muted" style="font-size:13px">Користете 10, 18 или друга стапка.</p>
      <h2 style="margin-top:20px">Календар</h2>
      <div class="row3">
        <label class="fld"><small>Почетен час</small><input type="number" id="set_sh" value="${s.startHour}"></label>
        <label class="fld"><small>Краен час</small><input type="number" id="set_eh" value="${s.endHour}"></label>
        <label class="fld"><small>Должина (мин)</small><input type="number" id="set_slot" value="${s.slotMin}"></label>
      </div>
      <small class="muted">Работни денови</small>
      <div style="margin-top:8px">${dayBtns}</div>
    </div>
  </div>
  <button class="btn" onclick="saveSettings()">Зачувај поставки</button>`;
}
function toggleDay(i){ const d=DB.data.settings.days; const idx=d.indexOf(i);
  if(idx>=0) d.splice(idx,1); else d.push(i); renderSettings(); }
async function saveSettings(){
  const s=DB.data.settings;
  s.name=$('#set_name').value; s.address=$('#set_addr').value; s.phone=$('#set_phone').value;
  s.tax=$('#set_tax').value; s.currency=$('#set_cur').value||'MKD';
  s.vatOn=$('#set_vaton').checked; s.vatRate=Number($('#set_vat').value)||0;
  s.startHour=Number($('#set_sh').value)||10; s.endHour=Number($('#set_eh').value)||20;
  s.slotMin=Number($('#set_slot').value)||120;
  busy(true);
  try{ await DB.saveSettings(); renderSettings(); toast('Зачувано'); }
  catch(e){ toast('Грешка'); console.error(e); }
  busy(false);
}

/* ============ BACKUP (download only — safety copy) ============ */
function exportBackup(){
  const blob=new Blob([JSON.stringify(DB.data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='autofolia_backup_'+ymd(new Date())+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Бекап преземен');
}

/* ============ BUSY / REFRESH ============ */
function busy(on){ document.body.style.cursor=on?'progress':'default'; }
async function refreshAll(){
  busy(true);
  try{ await DB.loadAll(); render(); }
  catch(e){ toast('Грешка при вчитување'); console.error(e); }
  busy(false);
}

/* ============ AUTH ============ */
async function doLogin(){
  const email=$('#lg_email').value.trim(), pw=$('#lg_pw').value;
  if(!email||!pw){ $('#lg_err').textContent='Внеси е-пошта и лозинка'; return; }
  $('#lg_err').textContent=''; $('#lg_btn').textContent='Се најавува...'; $('#lg_btn').disabled=true;
  try{
    const res=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pw})
    });
    const data=await res.json();
    if(!res.ok){ throw new Error(data.error_description||data.msg||'Најавата не успеа'); }
    SESSION=data;
    try{ localStorage.setItem('af_session',JSON.stringify(data)); }catch(e){}
    await startApp();
  }catch(e){
    $('#lg_err').textContent = 'Погрешна е-пошта или лозинка';
    console.error(e);
  }
  $('#lg_btn').textContent='Најави се'; $('#lg_btn').disabled=false;
}
async function doLogout(){
  try{ await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:sbHeaders()}); }catch(e){}
  SESSION=null; try{ localStorage.removeItem('af_session'); }catch(e){}
  showLogin();
}
async function tryRestoreSession(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem('af_session')); }catch(e){}
  if(!saved||!saved.refresh_token) return false;
  try{
    const res=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:saved.refresh_token})
    });
    if(!res.ok) return false;
    SESSION=await res.json();
    try{ localStorage.setItem('af_session',JSON.stringify(SESSION)); }catch(e){}
    return true;
  }catch(e){ return false; }
}

/* ============ SCREENS ============ */
function showLogin(){
  document.getElementById('appShell').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  $('#lg_pw').value='';
}
async function startApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appShell').style.display='block';
  await refreshAll();
}

/* close modal on overlay click */
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('show'); }));

/* ============ BOOT ============ */
(async function boot(){
  const ok=await tryRestoreSession();
  if(ok){ await startApp(); } else { showLogin(); }
})();
</script>
</body>
</html>
