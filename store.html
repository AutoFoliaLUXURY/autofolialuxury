<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Luxury — Премиум опрема за вашето возило</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#FFFFFF;          /* background */
    --header:#FFFFFF;      /* header */
    --gold:#C8A45D;        /* butonat */
    --text:#111111;        /* teksti kryesor */
    --text-muted:#6B6E73;  /* teksti sekondar */
    --surface:#F6F6F7;     /* kartelat */
    --surface-2:#EDEEF0;
    --border:#E2E3E6;
    --silver:#7E838A;
    --silver-light:#C9CCD1;
    --silver-grad:linear-gradient(135deg,#5E636A 0%,#A9ADB3 45%,#6F747B 70%,#3E4247 100%);
    --gold-soft:rgba(200,164,93,.14);
    --danger:#D2543A;
    --radius:2px;
    --maxw:1180px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Unbounded',sans-serif;
    font-weight:700;
    letter-spacing:-.01em;
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .headbar{display:flex;align-items:center;justify-content:space-between;height:76px;}
  .logo{font-family:'Unbounded',sans-serif;font-weight:800;font-size:20px;letter-spacing:.02em;}
  .logo span{background:var(--silver-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .navlinks{display:flex;gap:32px;font-size:14px;color:var(--text-muted);}
  .navlinks a:hover{color:var(--text);}
  .head-right{display:flex;align-items:center;gap:18px;}
  .phone-badge{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;}
  .cart-btn{
    position:relative;display:flex;align-items:center;gap:8px;
    border:1px solid var(--border);background:var(--surface);
    color:var(--text);padding:9px 16px;border-radius:var(--radius);
    font-size:13px;font-weight:600;
  }
  .cart-btn:hover{border-color:var(--gold);}
  .cart-count{
    background:var(--gold);color:#141414;font-size:11px;font-weight:700;
    width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }

  /* ---------- hero slider ---------- */
  .slider{
    position:relative;height:clamp(440px,62vh,600px);overflow:hidden;
    border-bottom:1px solid var(--border);background:var(--bg);
  }
  .slide{
    position:absolute;inset:0;opacity:0;visibility:hidden;
    transition:opacity .9s ease, visibility 0s linear .9s;
    background:
      radial-gradient(ellipse at 75% 45%, rgba(126,131,138,.16), transparent 60%),
      radial-gradient(ellipse at 10% 100%, rgba(200,164,93,.10), transparent 55%),
      linear-gradient(180deg,#FFFFFF 0%,#F1F2F4 100%);
  }
  .slide.active{opacity:1;visibility:visible;transition:opacity .9s ease;}
  .slide .wrap{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
  .slide-text > *{opacity:0;transform:translateY(26px);}
  .slide.active .slide-text > *{animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;}
  .slide.active .slide-text > *:nth-child(2){animation-delay:.12s;}
  .slide.active .slide-text > *:nth-child(3){animation-delay:.24s;}
  .slide.active .slide-text > *:nth-child(4){animation-delay:.36s;}
  @keyframes rise{to{opacity:1;transform:none;}}
  .kicker{
    font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px;
    background:var(--silver-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .slide h1{font-size:clamp(32px,4.8vw,60px);line-height:1.04;max-width:13ch;}
  .slide p{color:var(--text-muted);font-size:16px;max-width:42ch;margin:18px 0 28px;}
  .cta{
    display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#111;
    padding:14px 26px;border-radius:999px;font-weight:700;font-size:14px;border:none;
    transition:transform .2s, box-shadow .2s;
  }
  .cta:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(200,164,93,.25);}
  .slide-visual{position:relative;height:78%;display:flex;align-items:center;justify-content:center;}
  .slide-visual::before{
    content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle, rgba(126,131,138,.14), transparent 65%);
    border:1px solid rgba(126,131,138,.22);
  }
  .slide-visual img{
    position:relative;max-width:78%;max-height:92%;object-fit:contain;border-radius:14px;
    border:1px solid var(--border);background:#fff;
    opacity:0;transform:scale(.9) translateX(40px);
    box-shadow:0 24px 50px rgba(17,17,17,.14);
  }
  .slide.active .slide-visual img{animation:float-in 1.1s cubic-bezier(.2,.7,.2,1) .15s forwards;}
  @keyframes float-in{to{opacity:1;transform:none;}}
  .slider-btn{
    position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:46px;height:46px;border-radius:50%;border:1px solid var(--border);
    background:rgba(255,255,255,.85);color:var(--text);font-size:20px;
  }
  .slider-btn:hover{border-color:var(--silver);}
  .slider-btn.prev{left:20px;} .slider-btn.next{right:20px;}
  .dots{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5;}
  .dot{width:28px;height:3px;border:none;padding:0;background:var(--silver-light);position:relative;overflow:hidden;}
  .dot.active::after{
    content:"";position:absolute;inset:0;background:var(--text);
    transform-origin:left;animation:progress var(--slide-ms,6000ms) linear forwards;
  }
  .slider.paused .dot.active::after{animation-play-state:paused;}
  @keyframes progress{from{transform:scaleX(0);}to{transform:scaleX(1);}}

  /* ---------- main categories ---------- */
  .groups{padding:56px 0 8px;}
  .groups h2{font-size:22px;margin-bottom:22px;}
  .group-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;}
  @media(max-width:1100px){ .group-grid{grid-template-columns:repeat(4,1fr);} }
  .group-tile{
    position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:18px 14px;display:flex;flex-direction:column;gap:12px;text-align:left;color:var(--text);
    overflow:hidden;transition:border-color .2s, transform .2s;
    opacity:0;transform:translateY(18px);
  }
  .group-tile.in{opacity:1;transform:none;transition:opacity .6s ease, transform .6s ease, border-color .2s;}
  .group-tile::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%);
    transform:translateX(-100%);transition:transform .7s ease;
  }
  .group-tile:hover{border-color:var(--silver);transform:translateY(-3px);box-shadow:0 12px 28px rgba(17,17,17,.08);}
  .group-tile:hover::after{transform:translateX(100%);}
  .group-tile.active{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface));}
  .group-tile svg{width:30px;height:30px;stroke:var(--silver);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .group-tile.active svg{stroke:var(--gold);}
  .group-tile b{font-size:13px;font-weight:700;letter-spacing:.02em;line-height:1.3;}
  .group-tile span{font-size:12px;color:var(--text-muted);}

  /* ---------- categories ---------- */
  .cat-row{
    display:flex;gap:10px;overflow-x:auto;padding:22px 0 28px;
    border-bottom:1px solid var(--border);
  }
  .cat-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;border:1px solid var(--border);background:var(--surface);
    color:var(--text-muted);padding:9px 18px;border-radius:999px;font-size:13px;font-weight:500;
    white-space:nowrap;
  }
  .chip.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}

  /* ---------- product grid ---------- */
  .section{padding:56px 0;}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px;}
  .section-head h2{font-size:24px;}
  .section-head span{color:var(--text-muted);font-size:13px;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;
  }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s;
  }
  .card:hover{border-color:var(--gold);}
  .card-img{
    aspect-ratio:1/1;background:#FFFFFF;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    color:var(--border);font-family:'Unbounded',sans-serif;font-size:13px;overflow:hidden;
  }
  .card-img img{width:100%;height:100%;object-fit:contain;}
  .card-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .card-cat{font-size:11px;color:var(--silver);text-transform:uppercase;letter-spacing:.06em;}
  .card-name{font-size:15px;font-weight:600;flex:1;}
  .card-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
  .card-price{font-family:'Unbounded',sans-serif;font-size:17px;color:var(--text);}
  .add-btn{
    border:1px solid var(--gold);background:transparent;color:var(--gold);
    padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;
  }
  .add-btn:hover{background:var(--gold);color:#141414;}
  .search-box{
    width:100%;margin-top:24px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);
    color:var(--text);border-radius:var(--radius);font:inherit;font-size:14px;
  }
  .search-box:focus{outline:none;border-color:var(--gold);}
  .more-btn{
    display:block;margin:32px auto 0;border:1px solid var(--gold);background:transparent;color:var(--gold);
    padding:12px 28px;border-radius:var(--radius);font-size:14px;font-weight:600;
  }
  .more-btn:hover{background:var(--gold);color:#141414;}
  .empty-state{
    text-align:center;padding:64px 20px;color:var(--text-muted);border:1px dashed var(--border);
  }

  /* ---------- cart drawer ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:60;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(420px,100%);
    background:var(--surface);border-left:1px solid var(--border);
    display:flex;flex-direction:column;transform:translateX(100%);
    transition:transform .25s ease;z-index:61;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:22px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h3{font-size:17px;}
  .icon-btn{background:none;border:none;color:var(--text-muted);font-size:20px;line-height:1;}
  .drawer-body{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;}
  .cart-empty{color:var(--text-muted);font-size:14px;text-align:center;padding:40px 0;}
  .cart-item{display:flex;gap:12px;border-bottom:1px solid var(--border);padding-bottom:16px;}
  .cart-item img,.cart-item .ph{width:60px;height:60px;border-radius:var(--radius);object-fit:cover;background:var(--surface-2);flex:0 0 auto;}
  .ci-info{flex:1;display:flex;flex-direction:column;gap:6px;}
  .ci-top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;}
  .qty-row{display:flex;align-items:center;gap:10px;}
  .qbtn{width:24px;height:24px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:var(--radius);font-size:14px;}
  .ci-remove{font-size:12px;color:var(--danger);align-self:flex-start;background:none;border:none;}
  .drawer-foot{border-top:1px solid var(--border);padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
  .total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:700;}
  .total-row b{color:var(--gold);font-family:'Unbounded',sans-serif;}
  .primary-btn{
    background:var(--gold);color:#141414;border:none;padding:14px;border-radius:var(--radius);
    font-weight:700;font-size:14px;width:100%;
  }
  .primary-btn:disabled{opacity:.5;}

  /* ---------- checkout modal ---------- */
  .modal-wrap{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;
    z-index:70;padding:20px;
  }
  .modal-wrap.show{display:flex;}
  .modal{
    background:var(--surface);border:1px solid var(--border);width:100%;max-width:440px;
    padding:28px;border-radius:var(--radius);
  }
  .modal h3{font-size:19px;margin-bottom:6px;}
  .modal p.sub{color:var(--text-muted);font-size:13px;margin:0 0 22px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12px;color:var(--text-muted);}
  .field input,.field textarea{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:11px 12px;border-radius:var(--radius);font-family:inherit;font-size:14px;
  }
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--gold);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .ghost-btn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:12px 16px;border-radius:var(--radius);flex:0 0 auto;}
  /* ---------- product details ---------- */
  .card-img,.card-name{cursor:pointer;}
  .card-name:hover{color:var(--gold);}
  .pd-modal{max-width:820px;padding:0;max-height:calc(100vh - 40px);overflow-y:auto;position:relative;}
  .pd-close{position:absolute;top:10px;right:14px;font-size:26px;z-index:2;}
  .pd-grid{display:grid;grid-template-columns:1fr 1fr;}
  .pd-img{background:#fff;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;border-right:1px solid var(--border);}
  .pd-img img{width:100%;height:100%;object-fit:contain;}
  .pd-info{padding:28px;display:flex;flex-direction:column;gap:12px;}
  .pd-info h3{font-size:19px;line-height:1.35;margin:0;}
  .pd-price{font-family:'Unbounded',sans-serif;font-size:22px;color:var(--gold);}
  .pd-desc{font-size:14px;line-height:1.6;color:var(--text-muted);white-space:pre-line;border-top:1px solid var(--border);padding-top:14px;}
  @media(max-width:700px){
    .pd-grid{grid-template-columns:1fr;}
    .pd-img{border-right:none;border-bottom:1px solid var(--border);}
    .pd-info{padding:20px;}
  }
  .success-box{text-align:center;padding:20px 0;}
  .success-box .mark{font-size:38px;color:var(--gold);margin-bottom:14px;font-family:'Unbounded',sans-serif;}

  footer{border-top:1px solid var(--border);padding:36px 0;margin-top:40px;}
  .foot-row{display:flex;justify-content:space-between;color:var(--text-muted);font-size:13px;flex-wrap:wrap;gap:10px;}

  @media(max-width:760px){
    .wrap{padding:0 16px;}
    .navlinks,.phone-badge{display:none;}
    .slider{height:560px;}
    .slide .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:0;padding-top:40px;padding-bottom:70px;align-items:start;}
    .slide-visual{height:200px;order:-1;}
    .slider-btn{display:none;}
    .group-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none!important;animation-duration:.01ms!important;animation-delay:0s!important;}
    .group-tile{opacity:1;transform:none;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap headbar">
    <div class="logo">AUTO<span>LUXURY</span></div>
    <nav class="navlinks">
      <a href="#top">Почетна</a>
      <a href="#categories">Категории</a>
      <a href="#products">Производи</a>
      <a href="#contact">Контакт</a>
    </nav>
    <div class="head-right">
      <div class="phone-badge" id="phoneBadge"></div>
      <button class="cart-btn" id="cartBtn">
        Кошничка <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<section class="slider" id="top" aria-roledescription="carousel">
  <div id="slides"></div>
  <button class="slider-btn prev" id="prevSlide" aria-label="Претходен">&#8249;</button>
  <button class="slider-btn next" id="nextSlide" aria-label="Следен">&#8250;</button>
  <div class="dots" id="dots"></div>
</section>

<section class="groups" id="categories">
  <div class="wrap">
    <h2>Категории</h2>
    <div class="group-grid" id="groupGrid"></div>
  </div>
</section>

<div class="wrap">
  <input class="search-box" id="searchBox" type="search" placeholder="Пребарај производи...">
  <div class="cat-row" id="catRow"></div>
</div>

<section class="section" id="products">
  <div class="wrap">
    <div class="section-head">
      <h2>Производи</h2>
      <span id="resultCount"></span>
    </div>
    <div class="grid" id="grid"></div>
    <button class="more-btn" id="moreBtn" style="display:none">Прикажи повеќе</button>
  </div>
</section>

<footer id="contact">
  <div class="wrap foot-row">
    <span>© <span id="year"></span> Auto Luxury</span>
    <span id="footPhone"></span>
  </div>
</footer>

<!-- cart drawer -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>Вашата кошничка</h3>
    <button class="icon-btn" id="closeDrawer">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Вкупно</span><b id="cartTotal">0 MKD</b></div>
    <button class="primary-btn" id="checkoutBtn">Продолжи со порачка</button>
  </div>
</aside>

<!-- product details modal -->
<div class="modal-wrap" id="pdWrap">
  <div class="modal pd-modal" id="pdInner"></div>
</div>

<!-- checkout modal -->
<div class="modal-wrap" id="modalWrap">
  <div class="modal" id="modalInner">
    <h3>Податоци за достава</h3>
    <p class="sub">Ќе ве контактираме за потврда на порачката.</p>
    <div class="field"><label>Име и презиме</label><input id="fName" placeholder="Име Презиме"></div>
    <div class="field"><label>Телефон</label><input id="fPhone" placeholder="+389 7X XXX XXX"></div>
    <div class="field"><label>Адреса за достава</label><input id="fAddress" placeholder="Улица, град"></div>
    <div class="field"><label>Забелешка (опционално)</label><textarea id="fNote" rows="2" placeholder="Боја, детали..."></textarea></div>
    <div class="modal-actions">
      <button class="ghost-btn" id="cancelModal">Откажи</button>
      <button class="primary-btn" id="submitOrder">Испрати порачка</button>
    </div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const SB_URL = 'https://fzgnhfbsibskkuiwcrls.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6Z25oZmJzaWJza2t1aXdjcmxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTg4MjksImV4cCI6MjEwNDYzNDgyOX0.pgl4w-yG50eeGhEYdXM3VjWRUP2lSKDcsctnvCNG9KM';
const CONTACT_PHONE = '+389 70855355';

async function sbGet(path){
  const res = await fetch(SB_URL + '/rest/v1/' + path, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
async function sbPost(path, body){
  const res = await fetch(SB_URL + '/rest/v1/' + path, {
    method:'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
               'Content-Type':'application/json', Prefer:'return=representation' },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
const money = n => Number(n).toLocaleString('mk-MK') + ' MKD';

/* ================= STATE ================= */
let PRODUCTS = [];
let ACTIVE_CAT = 'Сите';
let CART = JSON.parse(localStorage.getItem('al_cart') || '[]');

function saveCart(){ localStorage.setItem('al_cart', JSON.stringify(CART)); renderCart(); }

/* ================= LOAD PRODUCTS ================= */
async function loadProducts(){
  // Supabase returns max 1000 rows per request, so fetch in pages
  PRODUCTS = [];
  try{
    const PAGE = 1000;
    for(let from=0; ; from+=PAGE){
      const chunk = await sbGet(`products?select=id,name,price,category,image_url&active=eq.true&order=created_at.desc&offset=${from}&limit=${PAGE}`);
      PRODUCTS.push(...chunk);
      if(chunk.length < PAGE) break;
    }
  }catch(e){ console.error(e); }
  PRODUCTS.forEach(p=>{ p.category = normCat(p.category); p.group = CAT_TO_GROUP[p.category] || ''; });
  buildGroups();
  buildCategories();
  buildSlider();
  renderGrid();
}

/* ================= GROUPS (kategoritë kryesore) ================= */
const normCat = c => String(c||'').replace(/&#8211;|–|—/g,'-').replace(/\s+/g,' ').trim();
const ICON = {
  car:'<path d="M3 13l2-5a2 2 0 0 1 2-1.3h10A2 2 0 0 1 19 8l2 5v4h-2"/><path d="M5 17H3v-4h18"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/>',
  spray:'<path d="M9 8h6v13H9z"/><path d="M10 8V5h4v3"/><path d="M14 5h3M18 3v.01M20 5v.01M18 7v.01"/>',
  wheel:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M4.2 16.5l5.2-3M19.8 16.5l-5.2-3"/>',
  seat:'<path d="M7 3h5a2 2 0 0 1 2 2v9H7z"/><path d="M5 14h12a2 2 0 0 1 2 2v1H5z"/><path d="M8 17v4M16 17v4"/>',
  light:'<path d="M14 5a7 7 0 0 1 0 14"/><path d="M14 5H11a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/><path d="M3 8h4M2 12h5M3 16h4"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>'
};
const GROUPS = [
  { name:'АВТО ОПРЕМА',   icon:'car',   cats:['АВТО ОПРЕМА','АЛАТИ','БРИШАЧИ','ПАТУВАЊЕ','ЦЕРАДИ'] },
  { name:'АВТОКОЗМЕТИКА', icon:'spray', cats:['89 AROMATIC','BRIO','DTR','K2','АВТОКОЗМЕТИКА','АРЕОН','АУТОЛАНД','КЛИ','МОТИП','ПАРФЕМИ IMAO','ТУРТЛЕ','ЧЕТКИ, КРПИ И СУНЃЕРИ'] },
  { name:'ЕКСТЕРИЕР',     icon:'wheel', cats:['THOR','БОДИ КИТОВИ','ДИФУЗЕРИ','ЕКСТЕРИЕР','КАПАЦИ ЗА СТРАНИЧНИ РЕТРОВИЗОРИ','НАКРАЈНИК ЗА АУСПУХ','ПРАГОВИ','ПРЕДЕН ЛИП СПОЈЛЕР','ПРЕДНА МАСКА','ПРЕДНИ/ЗАДНИ БРАНИЦИ','РАТКАПНИ','СПОЈЛЕР'] },
  { name:'ИНТЕРИЕР',      icon:'seat',  cats:['ВОЛАНИ','ИНТЕРИЕР','НАВЛАКИ ЗА ВОЛАН','НАВЛАКИ ЗА СЕДИШТИ','ПАТОСНИЦИ','РАЧКА ЗА МЕНУВАЧ','РАЧКИ ЗА ВРАТИ'] },
  { name:'ОСВЕТЛУВАЊЕ',   icon:'light', cats:['PHOTON СИЈАЛИЦИ','КСЕНОН','ЛЕД','ОСВЕТЛУВАЊЕ','ТРАФОА','ФАРОВИ','ХАЛОГЕН','ШТОПОВИ'] },
  { name:'ЕЛЕКТРИКА',     icon:'bolt',  cats:['АКУМУЛАТОРИ - БАТЕРИИ','ДРУГО','ЕЛЕКТРИКА','КАМЕРА ЗА КОЛА','МП3 ТРАНСМИТЕРИ','ПАРКИНГ СЕНЗОРИ','ПРЕКИДАЧИ','РАДИО И ОПРЕМА'] },
  { name:'АВТО ДОДАТОЦИ', icon:'key',   cats:['АВТО ДОДАТОЦИ','ГАЛАНТЕРИЈА','КЛУЧЕВИ','МОБИЛНА ГАЛАНТЕРИЈА','ПАНЦИР ЦРЕВА','ПРИВЕЗОК','СТАКЛО ЗА РЕТРОВИЗОР','СТИКЕРИ','ФОЛИЈА'] },
];
const CAT_TO_GROUP = {};
GROUPS.forEach(g=>g.cats.forEach(c=>CAT_TO_GROUP[normCat(c)] = g.name));
let ACTIVE_GROUP = '';

function buildGroups(){
  const grid = document.getElementById('groupGrid');
  const counts = {};
  PRODUCTS.forEach(p=>{ if(p.group) counts[p.group] = (counts[p.group]||0)+1; });
  grid.innerHTML = GROUPS.map((g,i)=>`
    <button class="group-tile${g.name===ACTIVE_GROUP?' active':''}" data-group="${escH(g.name)}" style="transition-delay:${i*60}ms">
      <svg viewBox="0 0 24 24" aria-hidden="true">${ICON[g.icon]}</svg>
      <b>${escH(g.name)}</b>
      <span>${(counts[g.name]||0).toLocaleString('mk-MK')} производи</span>
    </button>`).join('');
  grid.querySelectorAll('.group-tile').forEach(t=>{
    t.onclick = ()=> selectGroup(t.dataset.group === ACTIVE_GROUP ? '' : t.dataset.group, true);
  });
  // animacion kur shfaqen në ekran
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.2});
  grid.querySelectorAll('.group-tile').forEach(t=>io.observe(t));
}

function selectGroup(name, scroll){
  ACTIVE_GROUP = name;
  ACTIVE_CAT = 'Сите';
  document.querySelectorAll('.group-tile').forEach(t=>t.classList.toggle('active', t.dataset.group===ACTIVE_GROUP));
  buildCategories();
  renderGrid();
  if(scroll) document.getElementById('searchBox').scrollIntoView({behavior:'smooth', block:'start'});
}

function buildCategories(){
  const inGroup = ACTIVE_GROUP ? PRODUCTS.filter(p=>p.group===ACTIVE_GROUP) : PRODUCTS;
  const cats = ['Сите', ...new Set(inGroup.map(p=>p.category).filter(Boolean))];
  const row = document.getElementById('catRow');
  row.innerHTML = '';
  cats.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'chip' + (c===ACTIVE_CAT ? ' active' : '');
    b.textContent = c;
    b.onclick = ()=>{ ACTIVE_CAT = c; buildCategories(); renderGrid(); };
    row.appendChild(b);
  });
}

/* ================= SLIDER =================
   Ndrysho tekstet këtu. "group" = cila kategori hapet me butonin.
   "image" = link i figurës (nëse e lë bosh, merret automatikisht një produkt nga ajo kategori). */
const SLIDE_MS = 6000;
const SLIDES = [
  { kicker:'Ексклузивни модели', title:'Накрајници за ауспух', text:'Карбон, хром и црни завршници за секој стил.', group:'ЕКСТЕРИЕР', cat:'НАКРАЈНИК ЗА АУСПУХ', image:'' },
  { kicker:'Нова генерација',     title:'ЛЕД светла и барови', text:'Посилна светлина, помала потрошувачка.',      group:'ОСВЕТЛУВАЊЕ', cat:'ЛЕД', image:'' },
  { kicker:'Чистење и нега',      title:'Автокозметика',       text:'Сè што ви треба за возило што сјае.',         group:'АВТОКОЗМЕТИКА', cat:'', image:'' },
  { kicker:'Ентериер',            title:'Волани и навлаки',    text:'Премиум допир при секое возење.',             group:'ИНТЕРИЕР', cat:'ВОЛАНИ', image:'' },
];
let slideIdx = 0, slideTimer = null;

function buildSlider(){
  const wrap = document.getElementById('slides');
  const dots = document.getElementById('dots');
  document.querySelector('.slider').style.setProperty('--slide-ms', SLIDE_MS+'ms');
  wrap.innerHTML = SLIDES.map((s,i)=>{
    let img = s.image;
    if(!img){
      const pool = PRODUCTS.filter(p=>p.image_url && (s.cat ? p.category===normCat(s.cat) : p.group===s.group));
      pool.sort((a,b)=>Number(b.price)-Number(a.price));
      img = pool[0]?.image_url || '';
    }
    return `
    <div class="slide${i===0?' active':''}" aria-hidden="${i!==0}">
      <div class="wrap">
        <div class="slide-text">
          <div class="kicker">${escH(s.kicker)}</div>
          <h1>${escH(s.title)}</h1>
          <p>${escH(s.text)}</p>
          <button class="cta" data-i="${i}">Види повеќе <span aria-hidden="true">→</span></button>
        </div>
        <div class="slide-visual">${img ? `<img src="${escH(img)}" alt="">` : ''}</div>
      </div>
    </div>`;
  }).join('');
  dots.innerHTML = SLIDES.map((_,i)=>`<button class="dot${i===0?' active':''}" aria-label="Слајд ${i+1}" data-i="${i}"></button>`).join('');
  wrap.querySelectorAll('.cta').forEach(b=>b.onclick = ()=>{
    const s = SLIDES[+b.dataset.i];
    selectGroup(s.group, true);
    if(s.cat){ ACTIVE_CAT = normCat(s.cat); buildCategories(); renderGrid(); }
  });
  dots.querySelectorAll('.dot').forEach(d=>d.onclick = ()=>goSlide(+d.dataset.i));
  slideIdx = 0;
  startAuto();
}
function goSlide(i){
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  if(!slides.length) return;
  slideIdx = (i + slides.length) % slides.length;
  slides.forEach((s,k)=>{ s.classList.toggle('active', k===slideIdx); s.setAttribute('aria-hidden', k!==slideIdx); });
  dots.forEach((d,k)=>{ d.classList.remove('active'); if(k===slideIdx){ void d.offsetWidth; d.classList.add('active'); } });
  startAuto();
}
function startAuto(){
  clearInterval(slideTimer);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  slideTimer = setInterval(()=>{ if(!document.querySelector('.slider').classList.contains('paused')) goSlide(slideIdx+1); }, SLIDE_MS);
}
document.getElementById('prevSlide').onclick = ()=>goSlide(slideIdx-1);
document.getElementById('nextSlide').onclick = ()=>goSlide(slideIdx+1);
(()=>{
  const sl = document.querySelector('.slider');
  sl.addEventListener('mouseenter', ()=>sl.classList.add('paused'));
  sl.addEventListener('mouseleave', ()=>{ sl.classList.remove('paused'); goSlide(slideIdx); });
  let x0 = null;
  sl.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; }, {passive:true});
  sl.addEventListener('touchend', e=>{
    if(x0===null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx) > 40) goSlide(slideIdx + (dx < 0 ? 1 : -1));
  });
})();

const SHOW_STEP = 60;
let SHOWN = SHOW_STEP;
let SEARCH = '';
const escH = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function currentList(){
  let list = ACTIVE_GROUP ? PRODUCTS.filter(p=>p.group===ACTIVE_GROUP) : PRODUCTS;
  if(ACTIVE_CAT!=='Сите') list = list.filter(p=>p.category===ACTIVE_CAT);
  if(SEARCH){ const q = SEARCH.toLowerCase(); list = list.filter(p=>(p.name||'').toLowerCase().includes(q)); }
  return list;
}

function renderGrid(keepCount){
  if(!keepCount) SHOWN = SHOW_STEP;
  const grid = document.getElementById('grid');
  const moreBtn = document.getElementById('moreBtn');
  const list = currentList();
  document.getElementById('resultCount').textContent = list.length + ' производи';
  if(list.length===0){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Нема производи.</div>';
    moreBtn.style.display = 'none';
    return;
  }
  moreBtn.style.display = list.length > SHOWN ? 'block' : 'none';
  grid.innerHTML = list.slice(0, SHOWN).map(p=>`
    <div class="card">
      <div class="card-img" onclick="openProduct('${p.id}')">${p.image_url ? `<img src="${escH(p.image_url)}" alt="${escH(p.name)}" loading="lazy">` : 'AUTO LUXURY'}</div>
      <div class="card-body">
        <div class="card-cat">${escH(p.category)}</div>
        <div class="card-name" onclick="openProduct('${p.id}')">${escH(p.name)}</div>
        <div class="card-row">
          <div class="card-price">${money(p.price)}</div>
          <button class="add-btn" onclick="addToCart('${p.id}')">Додади</button>
        </div>
      </div>
    </div>
  `).join('');
}
document.getElementById('moreBtn').onclick = ()=>{ SHOWN += SHOW_STEP; renderGrid(true); };
let searchTimer;
document.getElementById('searchBox').oninput = e=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ SEARCH = e.target.value.trim(); renderGrid(); }, 200);
};

/* ================= PRODUCT DETAILS =================
   Teksti (description) merret vetëm kur hapet produkti, që faqja të ngarkohet shpejt. */
const pdWrap = document.getElementById('pdWrap');
const DESC_CACHE = {};
// Importuesi dhe telefoni i autoking-ut zëvendësohen me tonët (te tekstet e të gjitha produkteve)
const OUR_IMPORTER = 'Увозник: AutoLuxuryMK, Сарај, +38970855355';
function fixDesc(t){
  return String(t||'')
    .replace(/Увозник\s*:\s*Карикс\s*Груп[\s\S]{0,90}?Скопје,?(\s*\+\s*389\s*78\s*\/?\s*394\s*-?\s*07\d?)?/gi, OUR_IMPORTER)
    .replace(/Увозник\s*:\s*(Мега\s+Ауто\s+Парц|МАТРИКС)\s*[–-]\s*Скопје/gi, OUR_IMPORTER)
    .replace(/Увозник\s*:\s*Макорбитал/gi, OUR_IMPORTER)
    .replace(/Карикс\s*Груп/gi, 'AutoLuxuryMK')
    .replace(/\+\s*389\s*78\s*\/?\s*394\s*-?\s*07\d?/g, '+38970855355');
}
async function openProduct(id){
  const p = PRODUCTS.find(x=>String(x.id)===String(id));
  if(!p) return;
  const box = document.getElementById('pdInner');
  box.innerHTML = `
    <button class="icon-btn pd-close" onclick="closeProduct()" aria-label="Затвори">✕</button>
    <div class="pd-grid">
      <div class="pd-img">${p.image_url ? `<img src="${escH(p.image_url)}" alt="${escH(p.name)}">` : 'AUTO LUXURY'}</div>
      <div class="pd-info">
        <div class="card-cat">${escH(p.category)}</div>
        <h3>${escH(p.name)}</h3>
        <div class="pd-price">${money(p.price)}</div>
        <button class="primary-btn" onclick="closeProduct();addToCart(PRODUCTS.find(x=>String(x.id)==='${p.id}').id)">Додади во кошничка</button>
        <div class="pd-desc" id="pdDesc">Се вчитува...</div>
      </div>
    </div>`;
  pdWrap.classList.add('show');
  document.body.style.overflow = 'hidden';
  let desc = DESC_CACHE[id];
  if(desc === undefined){
    try{
      const r = await sbGet(`products?select=description&id=eq.${encodeURIComponent(id)}`);
      desc = DESC_CACHE[id] = fixDesc((r[0] && r[0].description) || '');
    }catch(e){ console.error(e); desc = ''; }
  }
  const el = document.getElementById('pdDesc');
  if(el) el.textContent = desc || 'За повеќе информации јавете се на ' + CONTACT_PHONE + '.';
}
function closeProduct(){ pdWrap.classList.remove('show'); document.body.style.overflow = ''; }
pdWrap.onclick = e=>{ if(e.target===pdWrap) closeProduct(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeProduct(); });

/* ================= CART ================= */
function addToCart(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  const existing = CART.find(x=>x.id===id);
  if(existing) existing.qty += 1;
  else CART.push({ id:p.id, name:p.name, price:Number(p.price), image_url:p.image_url, qty:1 });
  saveCart();
  openDrawer();
}
function changeQty(id, delta){
  const it = CART.find(x=>x.id===id);
  if(!it) return;
  it.qty += delta;
  if(it.qty<=0) CART = CART.filter(x=>x.id!==id);
  saveCart();
}
function removeItem(id){ CART = CART.filter(x=>x.id!==id); saveCart(); }

function cartTotal(){ return CART.reduce((s,i)=>s+i.price*i.qty,0); }

function renderCart(){
  const body = document.getElementById('drawerBody');
  document.getElementById('cartCount').textContent = CART.reduce((s,i)=>s+i.qty,0);
  document.getElementById('cartTotal').textContent = money(cartTotal());
  document.getElementById('checkoutBtn').disabled = CART.length===0;
  if(CART.length===0){
    body.innerHTML = '<div class="cart-empty">Кошничката е празна.</div>';
    return;
  }
  body.innerHTML = CART.map(it=>`
    <div class="cart-item">
      ${it.image_url ? `<img src="${it.image_url}">` : `<div class="ph"></div>`}
      <div class="ci-info">
        <div class="ci-top"><span>${it.name}</span><span>${money(it.price*it.qty)}</span></div>
        <div class="qty-row">
          <button class="qbtn" onclick="changeQty('${it.id}',-1)">−</button>
          <span>${it.qty}</span>
          <button class="qbtn" onclick="changeQty('${it.id}',1)">+</button>
        </div>
        <button class="ci-remove" onclick="removeItem('${it.id}')">Отстрани</button>
      </div>
    </div>
  `).join('');
}

/* ================= DRAWER / MODAL ================= */
const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');
function openDrawer(){ drawer.classList.add('show'); overlay.classList.add('show'); }
function closeDrawerFn(){ drawer.classList.remove('show'); overlay.classList.remove('show'); }
document.getElementById('cartBtn').onclick = openDrawer;
document.getElementById('closeDrawer').onclick = closeDrawerFn;
overlay.onclick = ()=>{ closeDrawerFn(); closeModal(); };

const modalWrap = document.getElementById('modalWrap');
function openModal(){ modalWrap.classList.add('show'); }
function closeModal(){ modalWrap.classList.remove('show'); }
document.getElementById('checkoutBtn').onclick = ()=>{ if(CART.length){ openModal(); } };
document.getElementById('cancelModal').onclick = closeModal;

document.getElementById('submitOrder').onclick = async ()=>{
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const address = document.getElementById('fAddress').value.trim();
  const note = document.getElementById('fNote').value.trim();
  if(!name || !phone || !address){
    alert('Ве молиме пополнете име, телефон и адреса.');
    return;
  }
  const btn = document.getElementById('submitOrder');
  btn.disabled = true; btn.textContent = 'Се испраќа...';
  try{
    await sbPost('orders', {
      customer_name: name, phone, address, note: note || null,
      items: CART.map(i=>({product_id:i.id, name:i.name, price:i.price, qty:i.qty})),
      total: cartTotal()
    });
    document.getElementById('modalInner').innerHTML = `
      <div class="success-box">
        <div class="mark">✓</div>
        <h3>Порачката е примена!</h3>
        <p class="sub">Ќе ве контактираме наскоро на ${phone} за потврда и достава.</p>
        <button class="primary-btn" onclick="location.reload()">Затвори</button>
      </div>`;
    CART = [];
    saveCart();
  }catch(e){
    console.error(e);
    alert('Настана грешка. Обидете се повторно или јавете се на ' + CONTACT_PHONE);
    btn.disabled = false; btn.textContent = 'Испрати порачка';
  }
};

/* ================= MISC ================= */
document.getElementById('phoneBadge').textContent = CONTACT_PHONE;
document.getElementById('footPhone').textContent = CONTACT_PHONE;
document.getElementById('year').textContent = new Date().getFullYear();

renderCart();
loadProducts();
</script>
